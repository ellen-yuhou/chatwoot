[variables]
NIXPACKS_NODE_VERSION = "18"
NIXPACKS_RUBY_VERSION = "3.2.2"

[phases.setup]
nixPkgs = ['nodejs', 'yarn', 'python3', 'pkg-config']
 
[phases.install]
cmds = [
  'bundle install',
  'yarn install'
]
  
[phases.build]
cmds = ['yarn install', 'bundle install', 'bundle exec rake assets:precompile']

[phases.start] 
cmd = "yarn start"

 
 
