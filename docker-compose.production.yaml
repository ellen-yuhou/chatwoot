version: '3.9'

services:
  # Define a reusable 'base' configuration for Rails/Sidekiq services
  base: &base
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      # CHANGED: Use a named volume for Active Storage
      - chatwoot_storage:/app/storage 

  rails:
    <<: *base # Inherit from the 'base' configuration
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'

    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - DATABASE_URL="postgresql://postgres:Active1234@postgres:5432/chatwoot"
      - SECRET_KEY_BASE="z63tJ9X416u6QAYjnCXoIf8wMotHg6jSy7iD70QWGyXdwDLbAOtHSPXYL21vBu4"
      - FRONTEND_URL="https://chat.tripdoer.com"
      - REDIS_URL="redis://:Active1234@redis:6379/0"

    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

    healthcheck:
      disable: true

  sidekiq:
    <<: *base # Inherit from the 'base' configuration
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - DATABASE_URL="postgresql://postgres:Active1234@postgres:5432/chatwoot"
      - SECRET_KEY_BASE="z63tJ9X416u6QAYjnCXoIf8wMotHg6jSy7iD70QWGyXdwDLbAOtHSPXYL21vBu4"
      - REDIS_URL="redis://:Active1234@redis:6379/0"
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: postgres:12
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Active1234 # Quoted for robustness

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    environment:
      REDIS_PASSWORD=Active1234 # Quoted for robustness

# Define named volumes for data persistence
volumes:
  # NEW: Named volume for Rails Active Storage
  chatwoot_storage: 
  postgres_data:
  redis_data:
