version: '3.9'

services:
  base: &base 
    # ───build:
      # ───context: .
      # ───dockerfile: docker/Dockerfile
    image: chatwoot/chatwoot:v4.3.0-ce  # ─ specific version tag (e.g., chatwoot/chatwoot:4.3.0)
    env_file: .env ## Change this file for customized env variables
    volumes:
      - storage_data:/app/storage
      - ./installation_config.yml:/app/config/installation_config.yml   # <--- Add this     
      # - ./brand-assets:/app/public/brand-assets 

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: "production"
      RAILS_ENV: "production"
      INSTALLATION_ENV: "docker"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/chatwoot"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      FRONTEND_URL: "https://chat.tripdoer.com"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: "production"
      RAILS_ENV: "production"
      INSTALLATION_ENV: "docker"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/chatwoot"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"  # Fixed: use environment variable instead of hardcoded value
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: postgres:12
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env # Change this file for customized env variables
    environment:
      POSTGRES_DB: "chatwoot"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    env_file: .env ## Change this file for customized env variables
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  storage_data:
  postgres_data:
  redis_data:
